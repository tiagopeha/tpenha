[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdah-ia-cli"
version = "0.2.0"
description = "CLI pessoal para apoiar rotina TDAH com IA + observabilidade"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]

[project.scripts]
tdah = "tdah_cli.cli:main"
aiobs-mcp = "aiobs_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["tdah_cli", "aiobs", "aiobs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
